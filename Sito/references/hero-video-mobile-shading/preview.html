<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LGE — inquadratura mobile dell’oscurante</title>
  <style>
    body { margin: 24px; background: #ede9e3; color: #252a30; font: 15px/1.5 system-ui; }
    main { display: flex; align-items: flex-start; gap: 28px; }
    iframe { width: 390px; height: 844px; max-width: 100%; border: 0; flex-shrink: 0; background: #fcfcfb; }
    section { max-width: 380px; }
    h1 { font-size: 22px; }
    button, input { min-height: 44px; margin: 4px; padding: 8px 14px; border: 1px solid #014380; border-radius: 8px; color: #014380; background: #fcfcfb; font: inherit; }
    input { width: 74px; box-sizing: border-box; }
    output { display: block; margin-top: 18px; }
    @media (max-width: 700px) { body { margin: 12px; } main { flex-direction: column-reverse; } iframe { width: min(390px, 100%); height: 844px; } }
  </style>
</head>
<body>
  <main>
    <iframe src="/#inizio" title="Hero reale in formato mobile" allow="autoplay"></iframe>
    <section>
      <h1>Inquadratura mobile · Oscurante</h1>
      <p>Anteprima locale della hero reale. La scena corretta si trova fra circa 45 e 51 secondi.</p>
      <label>Secondo <input id="time" type="number" min="0" max="52.9" value="48" step="0.1" /></label>
      <button id="seek" type="button">Mostra la scena</button>
      <button id="play" type="button">Riproduci</button>
      <output aria-live="polite">Attendi il caricamento della hero, poi mostra la scena.</output>
      <p><a href="/#inizio">Torna al sito</a></p>
    </section>
  </main>
  <script type="module">
    const frame = document.querySelector('iframe')
    const time = document.querySelector('#time')
    const output = document.querySelector('output')
    function getVideo() { return frame.contentDocument?.querySelector('#hero-video') }
    document.querySelector('#seek').addEventListener('click', () => {
      const video = getVideo()
      if (!video || video.readyState < 1) { output.textContent = 'Il filmato non è ancora pronto.'; return }
      const position = Number(time.value)
      if (!Number.isFinite(position)) return
      video.pause()
      video.currentTime = Math.max(0, Math.min(position, video.duration - 0.1))
      output.textContent = `Scena a ${position} s · ${video.currentSrc.split('/').pop()}`
    })
    document.querySelector('#play').addEventListener('click', () => {
      const video = getVideo()
      if (video) void video.play().catch(() => { output.textContent = 'Premi nuovamente Riproduci.' })
    })
  </script>
</body>
</html>
